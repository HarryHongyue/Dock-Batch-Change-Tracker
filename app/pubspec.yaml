name: dock_batch_change_tracker
description: "Dock & Batch Change Tracker - local-first warehouse dock and batch management."
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  drift: ^2.19.1
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5

  # Navigation
  go_router: ^14.8.1

  # Data models and serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Date/time and file handling
  intl: ^0.19.0
  path: ^1.9.0
  share_plus: ^9.0.0

  # Utilities
  uuid: ^4.6.0
  csv: ^6.0.0
  shared_preferences: ^2.5.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.19.1

  # Testing helpers
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
